{% load static %}

<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur-lg dark:border-slate-800 dark:bg-slate-900/80">
    <div class="mx-auto flex h-14 max-w-7xl items-center justify-between px-3 sm:h-16 sm:px-6 lg:px-8">

        <a href="{% url 'post:feed' %}" class="flex items-center gap-2 sm:gap-3">
            <img src="{% static 'images/logo.svg' %}" alt="Lumora" class="h-8 w-8 sm:h-10 sm:w-10">
            <span class="text-lg font-bold text-primary sm:text-2xl">Lumora</span>
        </a>

        <div class="hidden w-full max-w-md lg:block">
            <form action="{% url 'search' %}" method="get">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" name="q" placeholder="Search..." class="w-full rounded-xl border border-slate-300 bg-slate-100 py-2 pl-11 pr-4 outline-none focus:border-primary dark:border-slate-700 dark:bg-slate-800">
                </div>
            </form>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-3">
            {% if request.user.is_authenticated %}
                <a href="{% url 'post:feed' %}" data-nav-link class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Home">
                    <i class="fa-solid fa-house text-lg sm:text-xl"></i>
                </a>

                <a href="{% url 'post:reels' %}" data-nav-link class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Reels">
                    <i class="fa-solid fa-film text-lg sm:text-xl"></i>
                </a>

                <button id="themeToggle" data-theme-toggle class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Toggle Theme" aria-label="Toggle Theme" aria-pressed="false">
                    <i class="fa-solid fa-moon text-lg sm:text-xl"></i>
                </button>

                <a href="{% url 'notification:list' %}" data-nav-link class="relative rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Notifications">
                    <i class="fa-solid fa-bell text-lg sm:text-xl"></i>
                    <span class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full bg-red-500"></span>
                </a>

                <a href="{% url 'conversations' %}" data-nav-link class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Messages">
                    <i class="fa-solid fa-comments text-lg sm:text-xl"></i>
                </a>

                <a href="{% url 'profile' request.user.username %}" data-nav-link class="flex items-center">
                    {% if request.user.profile.avatar %}
                        <img src="{{ request.user.profile.avatar.url }}" alt="Avatar" class="h-8 w-8 rounded-full border object-cover sm:h-10 sm:w-10">
                    {% else %}
                        <img src="{% static 'images/default-avatar.svg' %}" alt="Avatar" class="h-8 w-8 rounded-full border object-cover sm:h-10 sm:w-10">
                    {% endif %}
                </a>
            {% else %}
                <a href="{% url 'post:feed' %}" data-nav-link class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Home">
                    <i class="fa-solid fa-house text-lg sm:text-xl"></i>
                </a>

                <a href="{% url 'search' %}" data-nav-link class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Search">
                    <i class="fa-solid fa-magnifying-glass text-lg sm:text-xl"></i>
                </a>

                <button id="themeToggle" data-theme-toggle class="rounded-xl p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800" title="Toggle Theme" aria-label="Toggle Theme" aria-pressed="false">
                    <i class="fa-solid fa-moon text-lg sm:text-xl"></i>
                </button>

                <div class="ml-1 flex items-center gap-1.5 sm:ml-2 sm:gap-2">
                    <a href="{% url 'login' %}" class="rounded-xl px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 sm:px-4">
                        Log In
                    </a>
                    <a href="{% url 'register' %}" class="rounded-xl bg-primary px-3 py-2 text-sm font-medium text-white hover:bg-primary/95 sm:px-4">
                        Sign Up
                    </a>
                </div>
            {% endif %}

        </div>
    </div>
</header>

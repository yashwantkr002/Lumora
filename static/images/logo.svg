<svg
    xmlns="http://www.w3.org/2000/svg"
    width="512"
    height="512"
    viewBox="0 0 512 512"
    fill="none"
>

    <defs>

        <linearGradient
            id="lumoraGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="50%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>

    </defs>

    <!-- Background -->

    <rect
        width="512"
        height="512"
        rx="120"
        fill="#0F172A"
    />

    <!-- Glow Circle -->

    <circle
        cx="256"
        cy="256"
        r="170"
        fill="url(#lumoraGradient)"
        opacity="0.18"
    />

    <!-- Letter L -->

    <path
        d="
            M170 120
            V360
            H340
            V315
            H225
            V120
            Z
        "
        fill="url(#lumoraGradient)"
    />

    <!-- Small Accent -->

    <circle
        cx="360"
        cy="150"
        r="18"
        fill="#60A5FA"
    />

</svg>